<div class="flex flex-col items-center justify-center px-6 py-14 text-center">
  @if (icon(); as i) {
    <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-ivory text-xl text-brand-taupe">
      <i class="fa-solid {{ i }}"></i>
    </div>
  } @else {
    <img src="images/brand/axxodia-mark.png" alt="" class="mb-4 h-10 w-auto opacity-40 grayscale-[35%]" />
  }
  <h3 class="font-heading text-xl font-bold text-brand-brown">{{ title() }}</h3>
  @if (message()) {
    <p class="mt-1 max-w-sm text-sm text-stone-400">{{ message() }}</p>
  }
  <div class="mt-4"><ng-content /></div>
</div>
