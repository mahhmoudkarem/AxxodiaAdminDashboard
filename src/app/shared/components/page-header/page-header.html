<div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
  <div class="flex min-w-0 items-start gap-3">
    @if (backLink(); as back) {
      <a [routerLink]="back" class="icon-btn mt-1 border border-brand-beige bg-white" aria-label="Back">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
    }
    @if (icon()) {
      <div class="hidden h-12 w-12 items-center justify-center rounded-2xl bg-white text-lg text-brand-brown shadow-sm ring-1 ring-brand-beige sm:flex">
        <i class="fa-solid {{ icon() }}"></i>
      </div>
    }
    <div class="min-w-0">
      <h1 class="font-heading text-2xl font-bold leading-tight text-brand-brown sm:text-3xl">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="mt-0.5 text-sm text-stone-400">{{ subtitle() }}</p>
      }
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-2">
    <ng-content />
  </div>
</div>
