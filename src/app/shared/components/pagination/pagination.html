<div class="flex flex-col items-center justify-between gap-3 border-t border-brand-beige px-4 py-3 text-sm sm:flex-row">
  <p class="text-xs text-stone-400">Showing {{ from() }}–{{ to() }} of {{ total() }}</p>
  <div class="flex items-center gap-1">
    <button type="button" class="icon-btn" [disabled]="page() <= 1" (click)="go(page() - 1)" aria-label="Previous page">
      <i class="fa-solid fa-chevron-left text-xs"></i>
    </button>
    <span class="px-3 text-xs font-semibold text-brand-brown">Page {{ page() }} / {{ pages() }}</span>
    <button type="button" class="icon-btn" [disabled]="page() >= pages()" (click)="go(page() + 1)" aria-label="Next page">
      <i class="fa-solid fa-chevron-right text-xs"></i>
    </button>
  </div>
</div>
