<div class="relative w-full min-w-52">
  <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-stone-400"></i>
  <input
    type="search"
    class="input pl-9 pr-9"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="onInput($any($event.target).value)"
  />
  @if (value()) {
    <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 px-2 text-stone-400 hover:text-brand-brown" (click)="clear()" aria-label="Clear">
      <i class="fa-solid fa-xmark"></i>
    </button>
  }
</div>
