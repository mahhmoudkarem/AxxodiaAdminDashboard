<ng-template #body>
  <div class="flex items-start justify-between gap-3">
    <div>
      <p class="text-[10px] font-bold uppercase tracking-wider text-stone-400 sm:text-xs">{{ label() }}</p>
      <p class="mt-2 font-heading text-3xl font-bold leading-none text-brand-dark sm:text-4xl">{{ value() ?? '—' }}</p>
      @if (hint()) {
        <p class="mt-2 text-xs text-stone-400">{{ hint() }}</p>
      }
    </div>
    <div class="hidden h-11 w-11 shrink-0 items-center justify-center rounded-xl sm:flex {{ toneClass() }}">
      <i class="fa-solid {{ icon() }}"></i>
    </div>
  </div>
</ng-template>

@if (link(); as l) {
  <a [routerLink]="l" class="card block h-full p-4 sm:p-5 transition hover:-translate-y-0.5 hover:shadow-md">
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else {
  <div class="card h-full p-4 sm:p-5"><ng-container [ngTemplateOutlet]="body" /></div>
}
