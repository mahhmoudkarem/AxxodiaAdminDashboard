<app-page-header
  [title]="isNew() ? 'New unit type' : (details()?.name_en ?? 'Unit type')"
  subtitle="Bedrooms, capacity, amenities and photos"
  icon="fa-layer-group"
  backLink="/catalog/unit-types"
>
  @if (canSave()) {
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving() || loading()">
      <i class="fa-solid" [class.fa-floppy-disk]="!saving()" [class.fa-circle-notch]="saving()" [class.fa-spin]="saving()"></i> Save
    </button>
  }
</app-page-header>

@if (loading()) {
  <app-loading />
} @else {
  <form [formGroup]="form" (ngSubmit)="save()" class="grid gap-6 xl:grid-cols-3">
    <div class="space-y-6 xl:col-span-2">
      <div class="card card-body">
        <h3 class="card-title mb-4">Details</h3>
        <div class="grid gap-4 md:grid-cols-2">
          <div class="md:col-span-2">
            <label class="label">Location *</label>
            <select class="input" formControlName="location_id">
              <option [ngValue]="null">Select a location</option>
              @for (l of locations(); track l.id) {
                <option [ngValue]="l.id">{{ l.name_en }}</option>
              }
            </select>
          </div>
          <div>
            <label class="label">Name (English) *</label>
            <input class="input" formControlName="name_en" placeholder="Two-bedroom apartment" />
          </div>
          <div>
            <label class="label">Name (Arabic) *</label>
            <input class="input" formControlName="name_ar" dir="rtl" />
          </div>
          <div>
            <label class="label">Description (English)</label>
            <textarea class="input min-h-28" formControlName="description_en"></textarea>
          </div>
          <div>
            <label class="label">Description (Arabic)</label>
            <textarea class="input min-h-28" formControlName="description_ar" dir="rtl"></textarea>
          </div>
        </div>
      </div>

      <div class="card card-body">
        <h3 class="card-title mb-4">Amenities</h3>
        <app-amenity-picker [amenities]="pickable()" [(selected)]="amenityIds" [disabled]="!canSave()" />
      </div>

      @if (!isNew()) {
        <app-image-manager entityType="UnitType" [entityId]="unitTypeId()!" [canEdit]="auth.hasPermission('unit_types.edit')" />
      }
    </div>

    <div class="card card-body h-fit space-y-4">
      <h3 class="card-title">Capacity</h3>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="label">Bedrooms *</label>
          <input type="number" class="input" formControlName="bedrooms" min="0" />
        </div>
        <div>
          <label class="label">Bathrooms *</label>
          <input type="number" class="input" formControlName="bathrooms" min="0" step="0.5" />
        </div>
        <div>
          <label class="label">Max guests *</label>
          <input type="number" class="input" formControlName="max_guests" min="1" />
        </div>
        <div>
          <label class="label">Area (m²)</label>
          <input type="number" class="input" formControlName="area_sqm" min="0" step="any" />
        </div>
      </div>
      <label class="flex items-center justify-between rounded-xl bg-brand-ivory px-4 py-3">
        <span class="text-sm font-semibold text-stone-600">Active</span>
        <input type="checkbox" class="h-5 w-5 accent-brand-brown" formControlName="is_active" />
      </label>
      @if (details(); as d) {
        <p class="muted">{{ d.rooms_count }} room(s) use this type.</p>
      }
    </div>
  </form>
}
