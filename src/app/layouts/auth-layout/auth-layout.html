<div class="grid min-h-screen lg:grid-cols-2">
  <!-- Brand panel -->
  <section class="relative hidden overflow-hidden bg-brand-dark lg:flex lg:flex-col lg:items-center lg:justify-center">
    <div class="pointer-events-none absolute -left-24 -top-24 h-96 w-96 rounded-full bg-brand-gold/10 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-32 -right-24 h-[28rem] w-[28rem] rounded-full bg-brand-taupe/10 blur-3xl"></div>

    <div class="relative z-10 flex flex-col items-center px-12 text-center">
      <app-brand-logo variant="light" imgClass="h-44 w-auto drop-shadow-xl" />
      <div class="my-8 h-px w-24 bg-brand-gold/50"></div>
      <p class="font-heading text-3xl font-semibold text-brand-ivory">Luxury hospitality, managed beautifully.</p>
      <p class="mt-3 max-w-md text-sm text-brand-taupe">
        Reservations, stays, housekeeping, maintenance, guest services and reports — all in one place.
      </p>
    </div>

    <p class="absolute bottom-6 text-xs text-brand-taupe/70">© {{ year }} Axxodia</p>
  </section>

  <!-- Form panel -->
  <section class="flex items-center justify-center bg-brand-ivory px-5 py-10">
    <div class="w-full max-w-md">
      <div class="mb-8 flex justify-center lg:hidden">
        <app-brand-logo variant="full" imgClass="h-24 w-auto" />
      </div>
      <router-outlet />
    </div>
  </section>
</div>
