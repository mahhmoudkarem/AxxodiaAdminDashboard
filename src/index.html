<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Axxodia | Admin Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Axxodia management portal - reservations, stays, housekeeping, maintenance, guest services and reports.">
  <meta name="theme-color" content="#594638">
  <meta name="robots" content="noindex, nofollow">

  <!-- Axxodia brand icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/brand/icon-192.png">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
  <meta property="og:title" content="Axxodia Admin Dashboard">
  <meta property="og:image" content="images/brand/og-image.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Splash shown until Angular starts */
    .axx-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #F7F4ED; }
    .axx-splash img { width: 150px; animation: axx-pulse 1.6s ease-in-out infinite; }
    .axx-splash span { font: 600 13px/1 Lato, sans-serif; letter-spacing: .35em; color: #B9A08B; text-transform: uppercase; }
    @keyframes axx-pulse { 0%, 100% { opacity: .55; transform: scale(.97); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <app-root>
    <div class="axx-splash">
      <img src="images/brand/axxodia-logo.png" alt="Axxodia">
      <span>Management Portal</span>
    </div>
  </app-root>
</body>
</html>
